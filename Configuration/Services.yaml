# Configuration/Services.yaml
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Cpsit\T3hauler\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Commands with proper DI
  Cpsit\T3hauler\Command\DiffCommand:
    tags:
      - name: 'console.command'
        command: 't3hauler:diff'
        description: 'Show pending changes since last snapshot'
        schedulable: false

  Cpsit\T3hauler\Command\CreateMigrationCommand:
    tags:
      - name: 'console.command'
        command: 't3hauler:create'
        description: 'Create migration from detected changes'
        schedulable: false

  Cpsit\T3hauler\Command\ApplyMigrationCommand:
    tags:
      - name: 'console.command'
        command: 't3hauler:apply'
        description: 'Apply migration with validation'
        schedulable: false

  Cpsit\T3hauler\Command\SnapshotCommand:
    tags:
      - name: 'console.command'
        command: 't3hauler:snapshot'
        description: 'Create or manage database snapshots'
        schedulable: false

  # Core services
  Cpsit\T3hauler\Service\ChangeDetectionService:
    arguments:
      $hashUtility: '@Cpsit\T3hauler\Utility\HashUtility'
      $snapshotRepository: '@Cpsit\T3hauler\Domain\Repository\DataSnapshotRepository'

  Cpsit\T3hauler\Service\IntegrityService:
    arguments:
      $hashUtility: '@Cpsit\T3hauler\Utility\HashUtility'

  # Repositories with proper database connection
  Cpsit\T3hauler\Domain\Repository\DataSnapshotRepository:
    arguments:
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  Cpsit\T3hauler\Domain\Repository\ChangeSetRepository:
    arguments:
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'
