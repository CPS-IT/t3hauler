# Configuration/Services.yaml
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Cpsit\T3hauler\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Core services
  Cpsit\T3hauler\Service\ChangeDetectionService:
    public: true
    arguments:
      $hashUtility: '@Cpsit\T3hauler\Utility\HashUtility'
      $snapshotRepository: '@Cpsit\T3hauler\Domain\Repository\DataSnapshotRepository'
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $changeRecordRepository: '@Cpsit\T3hauler\Domain\Repository\ChangeRecordRepository'

  # Migration services
  Cpsit\T3hauler\Service\MigrationService:
    arguments:
      $changeDetectionService: '@Cpsit\T3hauler\Service\ChangeDetectionService'
      $exportService: '@Cpsit\T3hauler\Service\ExportService'
      $migrationRepository: '@Cpsit\T3hauler\Domain\Repository\MigrationRepository'
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $hashUtility: '@Cpsit\T3hauler\Utility\HashUtility'

  Cpsit\T3hauler\Service\ExportService:
    arguments:
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  Cpsit\T3hauler\Service\ImportService:
    arguments:
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  Cpsit\T3hauler\Service\IntegrityService:
    arguments:
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $hashUtility: '@Cpsit\T3hauler\Utility\HashUtility'
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  # Repositories with proper database connection
  Cpsit\T3hauler\Domain\Repository\DataSnapshotRepository:
    public: true
    arguments:
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  Cpsit\T3hauler\Domain\Repository\MigrationRepository:
    arguments:
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  Cpsit\T3hauler\Domain\Repository\ChangeRecordRepository:
    arguments:
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  # Change tracking services
  Cpsit\T3hauler\Service\ChangeTrackingService:
    arguments:
      $changeRecordRepository: '@Cpsit\T3hauler\Domain\Repository\ChangeRecordRepository'
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'

  # DataHandler hook
  Cpsit\T3hauler\Hook\DataHandlerHook:
    arguments:
      $changeTrackingService: '@Cpsit\T3hauler\Service\ChangeTrackingService'
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $snapshotRepository: '@Cpsit\T3hauler\Domain\Repository\DataSnapshotRepository'
