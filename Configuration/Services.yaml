# Configuration/Services.yaml
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Cpsit\T3hauler\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Core services
  Cpsit\T3hauler\Service\ChangeDetectionService:
    public: true
    arguments:
      $hashUtility: '@Cpsit\T3hauler\Utility\HashUtility'
      $snapshotRepository: '@Cpsit\T3hauler\Domain\Repository\DataSnapshotRepository'
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $changeRecordRepository: '@Cpsit\T3hauler\Domain\Repository\ChangeRecordRepository'

  # Migration services
  Cpsit\T3hauler\Service\MigrationService:
    arguments:
      $changeDetectionService: '@Cpsit\T3hauler\Service\ChangeDetectionService'
      $exportService: '@Cpsit\T3hauler\Service\ExportService'
      $migrationRepository: '@Cpsit\T3hauler\Domain\Repository\MigrationRepository'
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $hashUtility: '@Cpsit\T3hauler\Utility\HashUtility'
      $filesystem: '@Cpsit\T3hauler\Service\FilesystemInterface'

  Cpsit\T3hauler\Service\ExportService:
    arguments:
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'
      $dataSnapshotRepository: '@Cpsit\T3hauler\Domain\Repository\DataSnapshotRepository'
      $filesystem: '@Cpsit\T3hauler\Service\FilesystemInterface'

  Cpsit\T3hauler\Service\ImportService:
    public: true
    arguments:
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'
      $filesystem: '@Cpsit\T3hauler\Service\FilesystemInterface'

  Cpsit\T3hauler\Service\IntegrityService:
    arguments:
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $hashUtility: '@Cpsit\T3hauler\Utility\HashUtility'
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  # Configuration service
  Cpsit\T3hauler\Configuration\T3HaulerConfiguration:
    public: true

  # Repositories with proper database connection
  Cpsit\T3hauler\Domain\Repository\DataSnapshotRepository:
    public: true
    arguments:
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  Cpsit\T3hauler\Domain\Repository\MigrationRepository:
    public: true
    arguments:
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  Cpsit\T3hauler\Domain\Repository\ChangeRecordRepository:
    arguments:
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'

  Cpsit\T3hauler\Domain\Repository\MigrationFileRepository:
    public: true
    arguments:
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $filesystem: '@Cpsit\T3hauler\Service\FilesystemInterface'

  # Filesystem services
  Cpsit\T3hauler\Service\FilesystemInterface:
    class: Cpsit\T3hauler\Service\FilesystemAdapter
    public: true

  # Change tracking services
  Cpsit\T3hauler\Service\ChangeTrackingService:
    arguments:
      $changeRecordRepository: '@Cpsit\T3hauler\Domain\Repository\ChangeRecordRepository'
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'

  # DataHandler hook
  Cpsit\T3hauler\Hook\DataHandlerHook:
    arguments:
      $changeTrackingService: '@Cpsit\T3hauler\Service\ChangeTrackingService'
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $snapshotRepository: '@Cpsit\T3hauler\Domain\Repository\DataSnapshotRepository'

  # Console commands
  Cpsit\T3hauler\Command\CreateSnapshotCommand:
    arguments:
      $changeDetectionService: '@Cpsit\T3hauler\Service\ChangeDetectionService'

  Cpsit\T3hauler\Command\CreateMigrationCommand:
    arguments:
      $migrationService: '@Cpsit\T3hauler\Service\MigrationService'
      $filesystem: '@Cpsit\T3hauler\Service\FilesystemInterface'

  Cpsit\T3hauler\Command\ListMigrationsCommand:
    arguments:
      $migrationFileRepository: '@Cpsit\T3hauler\Domain\Repository\MigrationFileRepository'

  Cpsit\T3hauler\Command\ListSnapshotsCommand:
    arguments:
      $configuration: '@Cpsit\T3hauler\Configuration\T3HaulerConfiguration'
      $snapshotRepository: '@Cpsit\T3hauler\Domain\Repository\DataSnapshotRepository'

  # Validators
  Cpsit\T3hauler\Domain\Validator\ExportJsonValidator:
    arguments:
      $filesystem: '@Cpsit\T3hauler\Service\FilesystemInterface'

  # Utilites
  Cpsit\T3hauler\Utility\HashUtility:
    arguments:
      $connectionPool: '@TYPO3\CMS\Core\Database\ConnectionPool'
